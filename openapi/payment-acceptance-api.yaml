openapi: 3.1.1
info:
  title: Coinbase Commerce API
  description: API for processing payments on the PaymentEscrow smart contract protocol.
  version: v0.0.1
tags:
  - name: Payments
    description: >-
      Endpoints focused on handling payment transactions.


      This includes operations for authorizing funds without immediate capture,
      and capturing previously authorized funds directly via the PaymentEscrow
      smart contract protocol. The endpoints help ensure secure and controlled
      payment processing, including verifying signatures, and updating payment
      statuses.
  - name: Rewards
    description: >-
      Endpoints for managing reward operations.


      These endpoints allow you to independently allocate, distribute, send, and
      deallocate rewards on previously successful payment operations.
  - name: Campaigns
    description: >-
      Endpoints for managing reward campaigns.


      Create and manage campaigns that integrate with the Flywheel smart
      contract to provide reward functionality. Campaigns allow merchants to
      define reward structures with customizable parameters including reward
      percentages and maximum limits.
  - name: coinbase.engine.operator_api.v1.OperatorApiService
paths:
  /api/v1/campaigns:
    post:
      summary: Create campaign
      description: Create a new campaign and deploy it onchain
      operationId: OperatorApiService_PostCampaign
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaignAddress:
                    type: string
                    description: The deployed campaign contract address
                    title: Campaign Address
                    examples:
                      - '0xabcdefabcdefabcdefabcdefabcdefabcdefabcd'
                required:
                  - campaignAddress
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        '@type':
                          type: string
                      additionalProperties: {}
      parameters:
        - schema:
            type: string
          name: x-idempotency-key
          description: Unique identifier to ensure request idempotency
          in: header
          required: true
      tags:
        - Campaigns
      security:
        - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                campaignType:
                  description: >-
                    Type of campaign. Defaults to CAMPAIGN_TYPE_CASHBACK_REWARDS
                    if not provided.
                  title: Campaign Type
                  examples:
                    - CAMPAIGN_TYPE_CASHBACK_REWARDS
                  type: string
                  enum:
                    - CAMPAIGN_TYPE_CASHBACK_REWARDS
                chainId:
                  type: integer
                  format: int32
                  description: Blockchain network identifier
                  title: Chain ID
                  examples:
                    - 8453
                maxRewardAmounts:
                  type: array
                  items:
                    type: object
                    properties:
                      tokenAddress:
                        type: string
                        description: >-
                          The token contract address for which this reward
                          amount limit applies
                        title: Token Address
                        examples:
                          - '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                      amount:
                        type: string
                        description: >-
                          Maximum reward amount with two decimal places. Must be
                          between 0.01 and 100,000,000.
                        title: Amount
                        examples:
                          - '100.00'
                    description: Maximum reward amount for a specific token.
                    title: MaxRewardAmount
                    required:
                      - tokenAddress
                      - amount
                    examples:
                      - tokenAddress: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                        amount: '100.00'
                  description: >-
                    Optional list of maximum reward amounts for specific tokens.
                    Only applicable for CAMPAIGN_TYPE_CASHBACK_REWARDS.
                  title: Max Reward Amounts
                  examples:
                    - - tokenAddress: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                        amount: '100.00'
                maxRewardBps:
                  type: integer
                  format: int32
                  description: >-
                    Optional immutable maximum reward percentage applied to the
                    smart contract (0-10000). Defaults to 10000 (no cap) if not
                    provided. Only applicable for
                    CAMPAIGN_TYPE_CASHBACK_REWARDS.
                  title: Max Reward BPS
                  examples:
                    - 1000
                ownerAddress:
                  type: string
                  description: Address that will own the campaign
                  title: Owner Address
                  examples:
                    - '0x1234567890123456789012345678901234567890'
                rewardBps:
                  type: integer
                  format: int32
                  description: >-
                    Reward percentage applied to the reward operations (1-10000,
                    cannot be 0). Only applicable for
                    CAMPAIGN_TYPE_CASHBACK_REWARDS.
                  title: Reward BPS
                  examples:
                    - 500
              required:
                - ownerAddress
                - chainId
                - rewardBps
        required: true
  /api/v1/operators:
    post:
      summary: Create Operator
      description: Create an operator for handling payments.
      operationId: OperatorApiService_PostOperator
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entity:
                    type: string
                    description: Entity type, usually 'operator'.
                    title: Entity
                    examples:
                      - operator
                  id:
                    type: string
                    description: Unique identifier of the operator.
                    title: Id
                    examples:
                      - op-324235
                  coinbaseUserId:
                    type: string
                    description: Unique coinbase user identifier of the operator.
                    title: Coinbase User Id
                    examples:
                      - cb-user-1234567890
                  name:
                    type: string
                    description: Name of the operator
                    title: Name
                    examples:
                      - Test operator
                  status:
                    description: Current status of the operator.
                    title: Status
                    examples:
                      - ACTIVATED
                    type: string
                    enum:
                      - ACTIVATED
                      - DEACTIVATED
                      - PENDING
                  smartAccountAddresses:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        addresses:
                          type: array
                          items:
                            type: string
                      description: List of account addresses
                      title: Addresses
                      examples:
                        - addresses:
                            - 0xwallet1
                            - 0xwallet2
                    description: >-
                      Map of smart account addresses associated with the
                      operator, grouped by network ID.
                    title: Smart Account Addresses
                    examples:
                      - '8453':
                          addresses:
                            - 0xsmartaccount1
                            - 0xsmartaccount2
                  callbackSecret:
                    type: string
                    description: The secret to encrypt callback payload
                    title: Callback Secret
                  createdAt:
                    type: string
                    format: date-time
                    description: Timestamp when the operator was created.
                    title: Created At
                    examples:
                      - 2024-03-20T00:00:00.000Z
                  updatedAt:
                    type: string
                    format: date-time
                    description: Timestamp when the operator was last updated.
                    title: Updated At
                    examples:
                      - 2024-03-20T00:00:00.000Z
                description: Representation of an operator
                title: Operator
                required:
                  - entity
                  - id
                  - coinbaseUserId
                  - name
                  - status
                  - smartAccountAddresses
                  - callbackSecret
                  - createdAt
                  - updatedAt
                examples:
                  - entity: operator
                    id: op-324235
                    coinbaseUserId: cb-user-1234567890
                    name: test.operator
                    status: ACTIVATED
                    smartAccountAddresses:
                      - 0xwallet1
                      - 0xwallet2
                    createdAt: 2024-03-20T00:00:00.000Z
                    updatedAt: 2024-03-20T00:00:00.000Z
                    callbackSecret: secret
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        '@type':
                          type: string
                      additionalProperties: {}
      tags:
        - Operator
      security:
        - Bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the operator
                  title: Name
                  examples:
                    - test.operator
              description: Request payload for creating an operator.
              title: PostOperatorRequest
              required:
                - name
              examples:
                - name: test.operator
                  status: ACTIVATED
        description: Request payload for creating an operator.
        required: true
  /api/v1/payment-operations/{id}:
    get:
      summary: Get Payment Operation
      description: Get Payment Operation
      operationId: OperatorApiService_GetPaymentOperation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentOperation:
                    description: Payment operation object.
                    title: Payment Operation
                    type: object
                    properties:
                      entity:
                        type: string
                        description: Entity type, e.g., 'payment-operation'.
                        title: Entity
                        examples:
                          - payment-operation
                      id:
                        type: string
                        description: Unique event ID.
                        title: Id
                        examples:
                          - event123
                      transactionHash:
                        type: string
                        description: Blockchain transaction hash.
                        title: Transaction Hash
                        examples:
                          - 0xhash
                      params:
                        type: object
                        additionalProperties:
                          type: string
                        description: Payment Operation Parameters.
                        title: Params
                        examples:
                          - amount: '10.00'
                      status:
                        description: Payment Operation status.
                        title: Status
                        examples:
                          - PAYMENT_OPERATION_STATUS_SUCCEEDED
                        type: string
                        enum:
                          - PAYMENT_OPERATION_STATUS_SUCCEEDED
                          - PAYMENT_OPERATION_STATUS_FAILED
                          - PAYMENT_OPERATION_STATUS_PENDING
                      action:
                        description: >-
                          Type of action (e.g.,
                          PAYMENT_OPERATION_ACTION_AUTHORIZE).
                        title: Action
                        examples:
                          - PAYMENT_OPERATION_ACTION_AUTHORIZE
                        type: string
                        enum:
                          - PAYMENT_OPERATION_ACTION_AUTHORIZE
                          - PAYMENT_OPERATION_ACTION_CAPTURE
                          - PAYMENT_OPERATION_ACTION_CHARGE
                          - PAYMENT_OPERATION_ACTION_RECLAIM
                          - PAYMENT_OPERATION_ACTION_REFUND
                          - PAYMENT_OPERATION_ACTION_VOID
                      createdAt:
                        type: string
                        format: date-time
                        description: Event creation timestamp.
                        title: Created At
                        examples:
                          - 2021-05-03T00:00:00.000Z
                      updatedAt:
                        type: string
                        format: date-time
                        description: Event update timestamp.
                        title: Updated At
                        examples:
                          - 2021-05-03T00:30:00.000Z
                      payment:
                        description: Detailed payment object.
                        title: Payment
                        examples:
                          - id: payment123
                        type: object
                        properties:
                          entity:
                            type: string
                            description: Entity type, e.g., 'payment'.
                            title: Entity
                            examples:
                              - payment
                          id:
                            type: string
                            description: Unique payment ID.
                            title: Id
                            examples:
                              - payment123
                          maxAmount:
                            type: string
                            description: Max payment amount approved by the buyer.
                            title: Max Amount
                            examples:
                              - '100.00'
                          token:
                            type: string
                            description: Token address used.
                            title: Token Address
                            examples:
                              - '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                          networkId:
                            type: integer
                            format: int32
                            description: Identifier for the blockchain network.
                            title: Network Id
                            examples:
                              - '8453'
                          payer:
                            type: string
                            description: Payer's EVM address.
                            title: Payer
                            examples:
                              - 0xpayer
                          signature:
                            type: string
                            description: >-
                              Digital signature of the preapproved amount signed
                              by the buyer.
                            title: Signature
                            examples:
                              - 0xsig
                          receiver:
                            type: string
                            description: Receiver's EVM address.
                            title: Receiver
                            examples:
                              - 0xreceiver
                          maxFeeBps:
                            type: integer
                            format: int32
                            description: Max fee in basis points.
                            title: Max Fee Bps
                            examples:
                              - '50'
                          minFeeBps:
                            type: integer
                            format: int32
                            description: Min fee in basis points.
                            title: Min Fee Bps
                            examples:
                              - '50'
                          feeReceiver:
                            type: string
                            description: Fee recipient address.
                            title: Fee Recipient
                            examples:
                              - '0xfee789'
                          salt:
                            type: string
                            description: >-
                              Unique salt to prevent duplicate preapproval
                              authorizations.
                            title: Salt
                            examples:
                              - '2334324235415445346745646'
                          paymentInfoHash:
                            type: string
                            description: Hash of the payment info.
                            title: Payment Info Hash
                            examples:
                              - '0x2334324235415445346745646'
                          nonce:
                            type: string
                            description: Nonce in the Preapproval Authorization.
                            title: Nonce in the Preapproval Authorization
                            examples:
                              - '2334324235415445346745646'
                          authorizationExpiry:
                            type: string
                            format: int64
                            description: Expiry time for the authorization.
                            title: Authorization expiry
                            examples:
                              - '1843954582'
                          preApprovalExpiry:
                            type: string
                            format: int64
                            description: Expiry time for preapproval
                            title: Pre-approval expiry
                            examples:
                              - '1843954582'
                          refundExpiry:
                            type: string
                            format: int64
                            description: Expiry time for refund
                            title: Refund expiry
                            examples:
                              - '1843954582'
                          createdAt:
                            type: string
                            format: date-time
                            description: Creation timestamp.
                            title: Created At
                            examples:
                              - 2021-05-03T00:00:00.000Z
                          updatedAt:
                            type: string
                            format: date-time
                            description: Last update timestamp.
                            title: Updated At
                            examples:
                              - 2021-05-03T01:00:00.000Z
                          operator:
                            type: string
                            description: Operator handling the payment.
                            title: Operator
                            examples:
                              - 0xoperator
                          contractAddress:
                            type: string
                            description: >-
                              Smart contract address of the Commerce
                              PaymentEscrow protocol
                            title: Contract Address
                            examples:
                              - 0xcontract
                          authorizedAmount:
                            type: string
                            description: Authorized payment amount.
                            title: Authorized Amount
                            examples:
                              - '50.00'
                          capturedAmount:
                            type: string
                            description: Captured payment amount.
                            title: Captured Amount
                            examples:
                              - '50.00'
                          voidedAmount:
                            type: string
                            description: Voided payment amount.
                            title: Voided Amount
                            examples:
                              - '0.00'
                          refundedAmount:
                            type: string
                            description: Refunded payment amount.
                            title: Refunded Amount
                            examples:
                              - '0.00'
                          chargedAmount:
                            type: string
                            description: Charged payment amount.
                            title: Charged Amount
                            examples:
                              - '50.00'
                          merchantId:
                            type: string
                            description: Merchant ID.
                            title: Merchant Id
                            examples:
                              - merchant123
                          sourceAddress:
                            type: string
                            description: >-
                              CAIP-10 Source address for payment if different
                              than payer address
                            title: Source Address
                            examples:
                              - >-
                                eip155:1:0x1234567890123456789012345678901234567890
                          sourceAsset:
                            type: string
                            description: >-
                              CAIP-19 Source asset identifier for payment if
                              different than token address
                            title: Source Asset
                            examples:
                              - eip155:1
                          tokenCollector:
                            type: string
                            description: Token collector address.
                            title: Token Collector
                            examples:
                              - 0xtokencollector
                        required:
                          - entity
                          - id
                          - maxAmount
                          - token
                          - networkId
                          - payer
                          - signature
                          - receiver
                          - maxFeeBps
                          - minFeeBps
                          - feeReceiver
                          - salt
                          - paymentInfoHash
                          - nonce
                          - authorizationExpiry
                          - preApprovalExpiry
                          - refundExpiry
                          - createdAt
                          - updatedAt
                          - operator
                          - contractAddress
                          - authorizedAmount
                          - capturedAmount
                          - voidedAmount
                          - refundedAmount
                          - chargedAmount
                          - merchantId
                      output:
                        type: string
                        description: Output of the payment operation.
                        title: Output
                        examples:
                          - 0xoutput
                      error:
                        type: string
                        description: Error of the payment operation.
                        title: Error
                        examples:
                          - an unknown error occurred
                      errorCode:
                        type: string
                        description: Error code of the payment operation.
                        title: Error Code
                        examples:
                          - Error
                      revertReason:
                        type: string
                        description: Blockchain revert reason of the payment operation.
                        title: Blockchain Revert Reason
                        examples:
                          - 0xrevert
                      blockNumber:
                        type: string
                        format: int64
                        description: Block number of the payment operation.
                        title: Block Number
                        examples:
                          - '123'
                      metadata:
                        type: object
                        description: Additional metadata as a free-form object.
                        title: Metadata
                        examples:
                          - key: value
                      operationSteps:
                        type: array
                        items:
                          type: object
                          properties:
                            entity:
                              type: string
                              description: Entity type, usually 'operation-step'.
                              title: Entity
                              examples:
                                - operation-step
                            id:
                              type: string
                              description: Unique identifier of the operation step.
                              title: Id
                              examples:
                                - os_01234567890abcdef
                            type:
                              description: >-
                                Type of the operation step (e.g., AUTH_ESCROW,
                                CROSSCHAIN, FLYWHEEL).
                              title: Operation Step Type
                              examples:
                                - OPERATION_STEP_TYPE_AUTH_ESCROW
                              type: string
                              enum:
                                - OPERATION_STEP_TYPE_AUTH_ESCROW
                                - OPERATION_STEP_TYPE_CROSSCHAIN
                                - OPERATION_STEP_TYPE_FLYWHEEL
                            operationId:
                              type: string
                              description: Identifier of the parent operation.
                              title: Operation Id
                              examples:
                                - op-2341434
                            operationType:
                              description: >-
                                Type of the parent operation (e.g., PAYMENT,
                                REWARD).
                              title: Operation Type
                              examples:
                                - OPERATION_TYPE_PAYMENT
                              type: string
                              enum:
                                - OPERATION_TYPE_PAYMENT
                                - OPERATION_TYPE_REWARD
                            params:
                              type: object
                              description: >-
                                Parameters for the operation step as a free-form
                                object.
                              title: Params
                              examples:
                                - key: value
                            status:
                              description: Current status of the operation step.
                              title: Status
                              examples:
                                - OPERATION_STEP_STATUS_SUCCEEDED
                              type: string
                              enum:
                                - OPERATION_STEP_STATUS_SUCCEEDED
                                - OPERATION_STEP_STATUS_FAILED
                                - OPERATION_STEP_STATUS_PENDING
                            error:
                              type: string
                              description: Error message if the operation step failed.
                              title: Error
                              examples:
                                - Failed to authorize escrow
                            errorCode:
                              type: string
                              description: Error code if the operation step failed.
                              title: Error Code
                              examples:
                                - AUTH_ESCROW_FAILED
                            createdAt:
                              type: string
                              format: date-time
                              description: Timestamp when the operation step was created.
                              title: Created At
                              examples:
                                - 2024-03-20T00:00:00.000Z
                            updatedAt:
                              type: string
                              format: date-time
                              description: >-
                                Timestamp when the operation step was last
                                updated.
                              title: Updated At
                              examples:
                                - 2024-03-20T00:30:00.000Z
                            transactions:
                              type: array
                              items:
                                type: object
                                properties:
                                  entity:
                                    type: string
                                    description: Entity type, usually 'transaction'.
                                    title: Entity
                                    examples:
                                      - transaction
                                  transactionHash:
                                    type: string
                                    description: Blockchain transaction hash.
                                    title: Transaction Hash
                                    examples:
                                      - >-
                                        0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
                                  blockNumber:
                                    type: string
                                    format: int64
                                    description: >-
                                      Block number where the transaction was
                                      included.
                                    title: Block Number
                                    examples:
                                      - '12345678'
                                  revertReason:
                                    type: string
                                    description: Revert reason if the transaction failed.
                                    title: Revert Reason
                                    examples:
                                      - Execution reverted
                                  createdAt:
                                    type: string
                                    format: date-time
                                    description: >-
                                      Timestamp when the transaction record was
                                      created.
                                    title: Created At
                                    examples:
                                      - 2024-03-20T00:00:00.000Z
                                  updatedAt:
                                    type: string
                                    format: date-time
                                    description: >-
                                      Timestamp when the transaction record was
                                      last updated.
                                    title: Updated At
                                    examples:
                                      - 2024-03-20T00:30:00.000Z
                                  operationStepId:
                                    type: string
                                    description: >-
                                      Identifier of the operation step this
                                      transaction belongs to.
                                    title: Operation Step Id
                                    examples:
                                      - os_01234567890abcdef
                                description: >-
                                  Represents a blockchain transaction with its
                                  hash, block number, and revert reason if
                                  applicable.
                                title: Transaction
                                required:
                                  - entity
                                  - transactionHash
                                  - blockNumber
                                  - createdAt
                                  - updatedAt
                                examples:
                                  - entity: transaction
                                    transactionHash: >-
                                      0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
                                    blockNumber: 12345678
                                    createdAt: 2024-03-20T00:00:00.000Z
                                    updatedAt: 2024-03-20T00:30:00.000Z
                              description: >-
                                Blockchain transactions associated with this
                                operation step.
                              title: Transactions
                              examples:
                                - - entity: transaction
                                    transactionHash: >-
                                      0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
                                    blockNumber: 12345678
                          description: >-
                            Represents a step within an operation, tracking its
                            type, status, and associated parameters.
                          title: OperationStep
                          required:
                            - entity
                            - id
                            - type
                            - operationId
                            - operationType
                            - status
                            - createdAt
                            - updatedAt
                          examples:
                            - entity: operation-step
                              id: os_01234567890abcdef
                              operationStepType: OPERATION_STEP_TYPE_AUTH_ESCROW
                              operationId: op-2341434
                              operationType: OPERATION_TYPE_PAYMENT
                              params:
                                key: value
                              status: OPERATION_STEP_STATUS_SUCCEEDED
                              createdAt: 2024-03-20T00:00:00.000Z
                              updatedAt: 2024-03-20T00:30:00.000Z
                        description: Steps executed as part of this payment operation.
                        title: Operation Steps
                        examples:
                          - - id: os_123
                              operation_step_type: OPERATION_STEP_TYPE_AUTH_ESCROW
                              status: OPERATION_STEP_STATUS_SUCCEEDED
                    required:
                      - entity
                      - id
                      - transactionHash
                      - params
                      - status
                      - action
                      - createdAt
                      - updatedAt
                      - payment
                    examples:
                      - entity: payment-operation
                        id: event123
                        transactionHash: 0xhash
                        amount: '50.00'
                        status: SUCCEEDED
                        eventType: AUTHORIZED
                        createdAt: 2021-05-03T00:00:00.000Z
                        updatedAt: 2021-05-03T00:30:00.000Z
                        payment:
                          id: payment123
                required:
                  - paymentOperation
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        '@type':
                          type: string
                      additionalProperties: {}
      parameters:
        - schema:
            type: string
          name: id
          in: path
          required: true
      tags:
        - Payments
      security:
        - Bearer: []
  /api/v1/payments:
    post:
      summary: Create payment
      description: Create a new payment.
      operationId: OperatorApiService_PostPayment
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    description: The payment information.
                    title: Payment
                    type: object
                    properties:
                      entity:
                        type: string
                        description: Entity type, e.g., 'payment'.
