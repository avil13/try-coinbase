servers:
  - url: https://payments.coinbase.com
components:
  schemas:
    coinbase.engine.operator_api.v1.Payment:
      type: object
      properties:
        entity:
          type: string
          description: Entity type, e.g., 'payment'.
          title: Entity
          examples:
            - payment
        id:
          type: string
          description: Unique payment ID.
          title: Id
          examples:
            - payment123
        maxAmount:
          type: string
          description: Max payment amount approved by the buyer.
          title: Max Amount
          examples:
            - '100.00'
        token:
          type: string
          description: Token address used.
          title: Token Address
          examples:
            - '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
        networkId:
          type: integer
          format: int32
          description: Identifier for the blockchain network.
          title: Network Id
          examples:
            - '8453'
        payer:
          type: string
          description: Payer's EVM address.
          title: Payer
          examples:
            - 0xpayer
        signature:
          type: string
          description: Digital signature of the preapproved amount signed by the buyer.
          title: Signature
          examples:
            - 0xsig
        receiver:
          type: string
          description: Receiver's EVM address.
          title: Receiver
          examples:
            - 0xreceiver
        maxFeeBps:
          type: integer
          format: int32
          description: Max fee in basis points.
          title: Max Fee Bps
          examples:
            - '50'
        minFeeBps:
          type: integer
          format: int32
          description: Min fee in basis points.
          title: Min Fee Bps
          examples:
            - '50'
        feeReceiver:
          type: string
          description: Fee recipient address.
          title: Fee Recipient
          examples:
            - '0xfee789'
        salt:
          type: string
          description: Unique salt to prevent duplicate preapproval authorizations.
          title: Salt
          examples:
            - '2334324235415445346745646'
        paymentInfoHash:
          type: string
          description: Hash of the payment info.
          title: Payment Info Hash
          examples:
            - '0x2334324235415445346745646'
        nonce:
          type: string
          description: Nonce in the Preapproval Authorization.
          title: Nonce in the Preapproval Authorization
          examples:
            - '2334324235415445346745646'
        authorizationExpiry:
          type: string
          format: int64
          description: Expiry time for the authorization.
          title: Authorization expiry
          examples:
            - '1843954582'
        preApprovalExpiry:
          type: string
          format: int64
          description: Expiry time for preapproval
          title: Pre-approval expiry
          examples:
            - '1843954582'
        refundExpiry:
          type: string
          format: int64
          description: Expiry time for refund
          title: Refund expiry
          examples:
            - '1843954582'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          title: Created At
          examples:
            - 2021-05-03T00:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp.
          title: Updated At
          examples:
            - 2021-05-03T01:00:00.000Z
        operator:
          type: string
          description: Operator handling the payment.
          title: Operator
          examples:
            - 0xoperator
        contractAddress:
          type: string
          description: Smart contract address of the Commerce PaymentEscrow protocol
          title: Contract Address
          examples:
            - 0xcontract
        authorizedAmount:
          type: string
          description: Authorized payment amount.
          title: Authorized Amount
          examples:
            - '50.00'
        capturedAmount:
          type: string
          description: Captured payment amount.
          title: Captured Amount
          examples:
            - '50.00'
        voidedAmount:
          type: string
          description: Voided payment amount.
          title: Voided Amount
          examples:
            - '0.00'
        refundedAmount:
          type: string
          description: Refunded payment amount.
          title: Refunded Amount
          examples:
            - '0.00'
        chargedAmount:
          type: string
          description: Charged payment amount.
          title: Charged Amount
          examples:
            - '50.00'
        merchantId:
          type: string
          description: Merchant ID.
          title: Merchant Id
          examples:
            - merchant123
      description: >-
        Payment details including identifiers, amounts, and blockchain
        transaction data.
      title: Payment
      required:
        - entity
        - id
        - maxAmount
        - token
        - networkId
        - payer
        - signature
        - receiver
        - maxFeeBps
        - minFeeBps
        - feeReceiver
        - salt
        - paymentInfoHash
        - nonce
        - authorizationExpiry
        - preApprovalExpiry
        - refundExpiry
        - createdAt
        - updatedAt
        - operator
        - contractAddress
        - authorizedAmount
        - capturedAmount
        - voidedAmount
        - refundedAmount
